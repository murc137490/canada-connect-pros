<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-size='48' font-family='Georgia' fill='%2315284A' font-weight='700'%3EP%3C/text%3E%3C/svg%3E"
    />
    <title>Première Services — Find the right professional near you</title>
    <meta name="description" content="Describe your need and receive quotes from trusted local service professionals across Quebec and Canada." />
    <meta name="author" content="Première Services" />
    <meta property="og:title" content="Première Services — Find the right professional" />
    <meta property="og:description" content="A modern marketplace for local service professionals. Post a request, compare quotes, book with confidence." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/boot/long-shadow.css" />
    <script>
      try {
        var theme = localStorage.getItem("premiere-theme");
        var dark =
          theme === "dark" ||
          (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-boot-theme", dark ? "dark" : "light");
      } catch (e) {
        document.documentElement.setAttribute("data-boot-theme", "light");
      }
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      #premiere-boot {
        --boot-bg: #f7f4ef;
        --boot-fg: #ffffff;
        /* Long-shadow extent in keyframes (~100px). Used for optical centering. */
        --boot-shadow-x: clamp(1.75rem, 8vw, 6.25rem);
        --boot-shadow-y: clamp(1.75rem, 8vw, 6.25rem);
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 100vw;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        min-height: 100svh;
        padding: env(safe-area-inset-top, 0)
          env(safe-area-inset-right, 0)
          env(safe-area-inset-bottom, 0)
          env(safe-area-inset-left, 0);
        background: var(--boot-bg);
        overflow: hidden;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }

      html[data-boot-theme="dark"] #premiere-boot {
        /* Exact match: .dark --background 222 20% 4% */
        --boot-bg: hsl(222 20% 4%);
        --boot-fg: #ffffff;
      }

      #premiere-boot.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #premiere-boot .site__main {
        /* text-shadow does not affect layout; shift so glyph+shadow mass sits true-center.
           Shadow runs left (−x) and down (+y) → white type otherwise looks right / slightly high. */
        display: flex;
        align-items: center;
        justify-content: center;
        width: min(94vw, 44rem);
        max-width: 100%;
        margin: 0;
        transform: translate(
          calc(var(--boot-shadow-x) * -0.42),
          calc(var(--boot-shadow-y) * 0.28)
        );
      }

      #premiere-boot .site__main > div {
        padding: clamp(1.25rem, 4vw, 4rem) clamp(1rem, 4vw, 3.5rem);
        overflow: visible;
        margin: 0;
        width: max-content;
        max-width: min(100%, 94vw);
        font-weight: 400;
        line-height: 0.92;
        letter-spacing: -0.02em;
        text-align: center;
        font-size: clamp(2.35rem, 8.5vw, 5.25rem);
        color: var(--boot-fg);
        font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
        font-kerning: normal;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: geometricPrecision;
        transform: translateZ(0);
        backface-visibility: hidden;
        will-change: text-shadow;
        animation-duration: 1s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
        animation-name: animateShadowLight;
      }

      html[data-boot-theme="dark"] #premiere-boot .site__main > div {
        animation-name: animateShadowDark;
      }

      #premiere-boot h1 {
        font: inherit;
        color: inherit;
        margin: 0;
        text-align: center;
        white-space: nowrap;
      }

      /* Phones / narrow: allow wrap so the block stays centered in the viewport */
      @media (max-width: 480px) {
        #premiere-boot {
          --boot-shadow-x: clamp(1.25rem, 10vw, 3.5rem);
          --boot-shadow-y: clamp(1.25rem, 10vw, 3.5rem);
        }
        #premiere-boot h1 {
          white-space: normal;
        }
        #premiere-boot .site__main > div {
          font-size: clamp(2.15rem, 11.5vw, 3.25rem);
          max-width: 88vw;
        }
      }

      /* Tall / portrait monitors: keep optical center, avoid oversized type eating the frame */
      @media (orientation: portrait) and (min-height: 900px) {
        #premiere-boot .site__main > div {
          font-size: clamp(2.75rem, 7.5vh, 5rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #premiere-boot .site__main {
          transform: none;
        }
        #premiere-boot .site__main > div {
          animation: none;
          will-change: auto;
          color: #15284a;
          text-shadow: none;
        }
        html[data-boot-theme="dark"] #premiere-boot .site__main > div {
          color: #ffffff;
        }
      }
    </style>
  </head>

  <body style="min-height:100vh;margin:0;padding:0;">
    <script>
      (function () {
        var dark = document.documentElement.getAttribute("data-boot-theme") === "dark";
        document.body.style.background = dark ? "hsl(222 20% 4%)" : "#f7f4ef";
      })();
    </script>

    <div id="premiere-boot" role="status" aria-label="Première Services">
      <main class="site__main">
        <div>
          <h1>
            Première<br />
            Services
          </h1>
        </div>
      </main>
    </div>

    <div id="root" style="min-height:100vh;margin:0;padding:0;width:100%;"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var boot = document.getElementById("premiere-boot");
        if (!boot) return;

        var finished = false;
        var MAX_MS = 11000;
        var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        function finish() {
          if (finished) return;
          finished = true;
          boot.classList.add("is-done");
          window.setTimeout(function () {
            if (boot.parentNode) boot.parentNode.removeChild(boot);
          }, 450);
        }

        window.addEventListener("premiere-app-ready", finish);
        window.__premiereMarkAppReady = finish;
        window.setTimeout(finish, reduceMotion ? 300 : MAX_MS);
      })();
    </script>
  </body>
</html>
