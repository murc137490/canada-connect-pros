<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f4ef" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AltShift" />
    <meta name="application-name" content="AltShift" />
    <!-- Tab icons: SA cutout (transparent). Opaque PWA squares stay in the webmanifest only.
         Runtime swaps these to starter/growth/pro when the signed-in account has a paid tier. -->
    <link rel="icon" href="/favicon-client.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-client-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-client-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-client-192.png" />
    <link rel="apple-touch-icon" href="/pwa-client-apple-touch.png" />
    <link rel="manifest" href="/manifest-client.webmanifest?v=7" />
    <title>AltShift</title>
    <meta name="description" content="Describe your need and receive quotes from trusted local service professionals across Quebec and Canada." />
    <meta name="author" content="Services AltShift Inc." />
    <meta property="og:title" content="AltShift" />
    <meta property="og:description" content="A modern marketplace for local service professionals. Post a request, compare quotes, book with confidence." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.altshift.ca" />
    <link rel="canonical" href="https://www.altshift.ca/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/boot/long-shadow.css" />
    <!-- Apple Pay JS 1.2+: required for Apple Pay on non-Safari desktop (QR → iPhone iOS 18+). -->
    <script src="https://applepay.cdn-apple.com/jsapi/1.latest/apple-pay-sdk.js" crossorigin="anonymous"></script>
    <script>
      try {
        var theme = localStorage.getItem("altshift-theme");
        var dark =
          theme === "dark" ||
          ((theme === "system" || theme === null) &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-boot-theme", dark ? "dark" : "light");
      } catch (e) {
        document.documentElement.setAttribute("data-boot-theme", "light");
      }
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      #altshift-boot {
        --boot-bg: #f7f4ef;
        --boot-fg: #ffffff;
        /* Must match long-shadow.css max offset (−100px, +100px). */
        --boot-shadow: 100px;
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        min-height: 100svh;
        margin: 0;
        padding: env(safe-area-inset-top, 0)
          env(safe-area-inset-right, 0)
          env(safe-area-inset-bottom, 0)
          env(safe-area-inset-left, 0);
        background: var(--boot-bg);
        overflow: hidden;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }

      html[data-boot-theme="dark"] #altshift-boot {
        --boot-bg: #0a0a0a;
        --boot-fg: #ffffff;
      }

      #altshift-boot.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /*
        text-shadow does not expand layout. Pad left + bottom by the shadow extent so the
        flex-centered box is the visual logo (glyphs + long shadow). That puts the logo
        center on the screen center.
      */
      #altshift-boot .site__main {
        box-sizing: content-box;
        width: max-content;
        max-width: none;
        margin: 0;
        padding: 0 0 var(--boot-shadow) var(--boot-shadow);
        display: block;
        transform-origin: center center;
      }

      #altshift-boot .boot-logo {
        margin: 0;
        padding: 0;
        width: max-content;
        font-weight: 400;
        line-height: 0.92;
        letter-spacing: -0.02em;
        text-align: center;
        /* Original Première size + 5% */
        font-size: clamp(2.625rem, 8.4vw, 5.5125rem);
        color: var(--boot-fg);
        font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
        font-kerning: normal;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: geometricPrecision;
        transform: translateZ(0);
        backface-visibility: hidden;
        will-change: text-shadow;
        animation-duration: 1s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
        animation-name: animateShadowLight;
      }

      html[data-boot-theme="dark"] #altshift-boot .boot-logo {
        animation-name: animateShadowDark;
      }

      #altshift-boot h1 {
        font: inherit;
        color: inherit;
        margin: 0;
        padding: 0;
        text-align: center;
        white-space: nowrap;
      }

      @media (max-width: 640px) {
        #altshift-boot .site__main {
          transform: scale(1.09);
        }
        #altshift-boot .boot-logo {
          font-size: clamp(3.444rem, 16.905vw, 5.1345rem);
        }
      }

      @media (max-width: 380px) {
        #altshift-boot .site__main {
          transform: scale(1.01);
        }
        #altshift-boot .boot-logo {
          font-size: clamp(3.1395rem, 18.1125vw, 4.5255rem);
        }
      }

      @media (orientation: portrait) and (min-height: 900px) and (min-width: 641px) {
        #altshift-boot .boot-logo {
          font-size: clamp(2.8875rem, 7.35vh, 5.25rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #altshift-boot .site__main {
          padding: 0;
          transform: none;
        }
        #altshift-boot .boot-logo {
          animation: none;
          will-change: auto;
          color: #15284a;
          text-shadow: none;
        }
        html[data-boot-theme="dark"] #altshift-boot .boot-logo {
          color: #ffffff;
        }
      }
    </style>
  </head>

  <body style="min-height:100vh;margin:0;padding:0;">
    <script>
      (function () {
        var dark = document.documentElement.getAttribute("data-boot-theme") === "dark";
        document.body.style.background = dark ? "#0a0a0a" : "#f7f4ef";
      })();
    </script>

    <div id="altshift-boot" role="status" aria-label="AltShift">
      <main class="site__main">
        <div class="boot-logo">
          <h1>AltShift</h1>
        </div>
      </main>
    </div>

    <div id="root" style="min-height:100vh;margin:0;padding:0;width:100%;"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var boot = document.getElementById("altshift-boot");
        if (!boot) return;

        var finished = false;
        var MAX_MS = 11000;
        var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        function finish() {
          if (finished) return;
          finished = true;
          boot.classList.add("is-done");
          window.setTimeout(function () {
            if (boot.parentNode) boot.parentNode.removeChild(boot);
          }, 450);
        }

        window.addEventListener("altshift-app-ready", finish);
        window.__altshiftMarkAppReady = finish;
        window.setTimeout(finish, reduceMotion ? 300 : MAX_MS);
      })();
    </script>
  </body>
</html>
